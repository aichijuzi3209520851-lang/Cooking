# 持续集成：语法检查 + lint + 单元/契约测试（ENG-001）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 项目零 npm 依赖（检查脚本均基于 Node 标准库），且 package-lock.json 被 .gitignore 忽略，
      # 因此 setup-node 不开启 cache: npm —— 该选项要求仓库存在锁文件，否则直接报错
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 语法检查
        run: npm run check:syntax
      - name: Lint（安全与资源静态检查）
        run: npm run lint
      - name: 单元测试
        run: npm run test:unit
      - name: 接口契约检查
        run: npm run check:contracts
