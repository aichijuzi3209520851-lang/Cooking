             C 298 170, 318 235, 308 300
             C 298 365, 272 405, 256 420
             C 240 405, 214 365, 206 300
             C 198 235, 212 170, 252 160 Z"
          fill="#D93A2B"/>
    <!-- 月牙形浅色高光 -->
    <path d="M 232 205
             C 222 240, 224 300, 236 340
             C 240 348, 246 344, 244 335
             C 234 295, 232 245, 242 210
             C 244 203, 236 200, 232 205 Z"
          fill="#F09080" opacity="0.55"/>
    <!-- 椒蒂茎 -->
    <rect x="247" y="138" width="18" height="32" rx="7" fill="#2F9E6E"/>
    <!-- 左椒蒂叶 -->
    <path d="M 250 148
             C 224 128, 192 134, 182 155
             C 204 162, 234 158, 250 150 Z"
          fill="#2F9E6E"/>
    <!-- 右椒蒂叶 -->
    <path d="M 262 148
             C 288 128, 320 134, 330 155
             C 308 162, 278 158, 262 150 Z"
          fill="#2F9E6E"/>
  </g>
</svg>
