  <ellipse cx="256" cy="340" rx="160" ry="35" fill="#6B4528" opacity="0.5"/>
  <!-- 肉块1（左后，最大） -->
  <rect x="118" y="210" width="110" height="110" rx="22" fill="#8B5E3C"/>
  <rect x="118" y="210" width="110" height="40" rx="22" fill="#A0704A"/>
  <ellipse cx="150" cy="235" rx="18" ry="10" fill="#C4956A" opacity="0.5"/>
