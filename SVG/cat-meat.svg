  <rect x="200" y="170" width="115" height="140" rx="24" fill="#7A4E2E"/>
  <rect x="200" y="170" width="115" height="48" rx="24" fill="#9B6538"/>
  <ellipse cx="235" cy="195" rx="22" ry="12" fill="#C4956A" opacity="0.5"/>
  <!-- 肉块3（右后） -->
  <rect x="290" y="205" width="108" height="108" rx="22" fill="#8B5E3C"/>
  <rect x="290" y="205" width="108" height="38" rx="22" fill="#A0704A"/>
  <ellipse cx="322" cy="228" rx="16" ry="9" fill="#C4956A" opacity="0.5"/>
  <!-- 肉块4（右前小） -->
  <rect x="340" y="258" width="80" height="80" rx="18" fill="#7A4E2E"/>
  <rect x="340" y="258" width="80" height="28" rx="18" fill="#9B6538"/>
  <!-- 葱花点缀（绿色小碎点） -->
  <circle cx="175" cy="218" r="6" fill="#2F9E6E"/>
  <circle cx="256" cy="178" r="7" fill="#3CB07E"/>
  <circle cx="330" cy="212" r="6" fill="#2F9E6E"/>
  <circle cx="375" cy="268" r="5" fill="#3CB07E"/>
  <circle cx="220" cy="290" r="5" fill="#2F9E6E"/>
  <!-- 酱汁高光 -->
