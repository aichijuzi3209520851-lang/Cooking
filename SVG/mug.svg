<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 热茶杯：暖棕色马克杯 + 姜黄色蒸汽 -->
  <!-- 杯把（C形，同色，先画在杯身后面） -->
  <path d="M 348 248
           C 395 248, 420 275, 420 310
           C 420 345, 395 372, 348 372"
        stroke="#8B5E3C" stroke-width="26" fill="none" stroke-linecap="round"/>
  <!-- 杯把内侧暗部 -->
  <path d="M 352 268
           C 382 268, 398 288, 398 310
           C 398 332, 382 352, 352 352"
        stroke="#6B4528" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- 杯身（圆角矩形） -->
  <rect x="148" y="210" width="200" height="190" rx="32" fill="#8B5E3C"/>
  <!-- 杯口内深棕 -->
  <ellipse cx="248" cy="212" rx="96" ry="20" fill="#5C3A22"/>
  <!-- 杯口沿亮边 -->
  <ellipse cx="248" cy="210" rx="96" ry="18" fill="none" stroke="#A0704A" stroke-width="4" opacity="0.6"/>
  <!-- 杯身浅反光 -->
  <path d="M 175 240 C 168 290, 172 350, 188 385"
        stroke="#A0704A" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- 左缕蒸汽（S形） -->
  <path d="M 218 195
           C 198 168, 240 148, 220 118
           C 208 100, 222 85, 232 72"
        stroke="#E6A23C" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- 右缕蒸汽（S形） -->
  <path d="M 278 195
           C 298 168, 256 148, 276 118
           C 288 100, 274 85, 264 72"
        stroke="#E6A23C" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.85"/>
</svg>
