<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 空状态：先加入家庭吧 —— 圆角小房子 + 炊烟 + 暖黄门窗 + 餐叉路标 -->
  <!-- 餐叉路标（最左侧，先画在后面） -->
  <rect x="96" y="290" width="10" height="120" rx="5" fill="#8B5E3C"/>
  <rect x="72" y="268" width="58" height="40" rx="8" fill="#FDF3E3"/>
  <!-- 餐叉图案 -->
  <rect x="98" y="278" width="4" height="22" rx="2" fill="#8B5E3C"/>
  <rect x="90" y="276" width="4" height="10" rx="2" fill="#8B5E3C"/>
  <rect x="98" y="276" width="4" height="10" rx="2" fill="#8B5E3C"/>
  <rect x="106" y="276" width="4" height="10" rx="2" fill="#8B5E3C"/>
  <!-- 房子墙体（奶油白） -->
  <rect x="152" y="232" width="208" height="172" rx="22" fill="#FDF3E3"/>
  <!-- 屋顶（番茄红，圆润弧形） -->
  <path d="M 130 240
           C 130 185, 195 152, 256 152
           C 317 152, 382 185, 382 240
           L 370 240
           C 370 198, 315 172, 256 172
           C 197 172, 142 198, 142 240 Z"
        fill="#D93A2B"/>
  <!-- 烟囱（暖棕） -->
  <rect x="310" y="158" width="30" height="52" rx="6" fill="#8B5E3C"/>
  <!-- 炊烟（姜黄 S 形） -->
  <path d="M 325 150
           C 310 128, 340 112, 328 88
           C 320 72, 332 58, 340 46"
        stroke="#E6A23C" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- 门（暖黄灯光） -->
  <rect x="232" y="310" width="52" height="94" rx="10" fill="#E6A23C"/>
  <circle cx="272" cy="358" r="4" fill="#8B5E3C"/>
  <!-- 左窗（暖黄） -->
  <rect x="178" y="272" width="44" height="44" rx="8" fill="#E6A23C"/>
  <line x1="200" y1="272" x2="200" y2="316" stroke="#FDF3E3" stroke-width="3"/>
  <line x1="178" y1="294" x2="222" y2="294" stroke="#FDF3E3" stroke-width="3"/>
  <!-- 右窗（暖黄） -->
  <rect x="290" y="272" width="44" height="44" rx="8" fill="#E6A23C"/>
  <line x1="312" y1="272" x2="312" y2="316" stroke="#FDF3E3" stroke-width="3"/>
  <line x1="290" y1="294" x2="334" y2="294" stroke="#FDF3E3" stroke-width="3"/>
  <!-- 房子底部小高光 -->
  <path d="M 170 380 C 200 396, 312 396, 342 380"
        stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
