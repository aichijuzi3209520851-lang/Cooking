<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 小鱼：胖乎乎焦糖橙，头朝左 -->
  <!-- 鱼尾（深橙色分叉，先画在身体后面） -->
  <path d="M 350 245
           L 420 195
           L 395 265
           L 420 335
           L 350 295
           C 340 285, 340 255, 350 245 Z"
        fill="#D06A0F"/>
  <!-- 鱼身 -->
  <path d="M 145 270
           C 145 200, 225 178, 305 208
           C 348 224, 362 248, 362 270
           C 362 292, 348 316, 305 332
           C 225 362, 145 340, 145 270 Z"
        fill="#F0821E"/>
  <!-- 鱼肚浅色 -->
  <path d="M 165 300
           C 200 330, 280 340, 330 318"
        stroke="#F5A860" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- 深橙色弧形鳃纹 -->
  <path d="M 218 228
           C 232 250, 232 290, 218 312"
        stroke="#D06A0F" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- 眼睛（深棕色大圆） -->
  <circle cx="192" cy="252" r="16" fill="#5C3A22"/>
  <!-- 眼睛白色高光点 -->
  <circle cx="186" cy="246" r="6" fill="#FFFFFF"/>
  <!-- 鱼背小高光 -->
  <path d="M 200 210 C 240 192, 290 196, 320 212"
        stroke="#F5A860" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.45"/>
</svg>
