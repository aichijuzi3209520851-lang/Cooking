<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 分类图：素菜 —— 清炒绿叶蔬菜（主体占满85%+） -->
  <!-- 盘子 -->
  <ellipse cx="256" cy="370" rx="205" ry="55" fill="#E8DDC8"/>
  <ellipse cx="256" cy="364" rx="205" ry="50" fill="#FDF3E3"/>
  <!-- 底层叶片（深绿，大） -->
  <path d="M 100 340
           C 80 270, 140 200, 210 195
           C 250 192, 270 230, 260 280
           C 252 320, 180 350, 100 340 Z"
        fill="#2F9E6E"/>
  <path d="M 412 340
           C 432 270, 372 200, 302 195
           C 262 192, 242 230, 252 280
           C 260 320, 332 350, 412 340 Z"
        fill="#2F9E6E"/>
  <!-- 中层叶片（中绿） -->
  <path d="M 150 320
           C 130 250, 190 185, 256 180
           C 310 176, 340 220, 330 275
           C 322 315, 240 340, 150 320 Z"
        fill="#3CB07E"/>
  <!-- 顶层叶片（浅绿，最靠前） -->
  <path d="M 190 310
           C 175 255, 220 210, 270 208
           C 305 206, 325 240, 318 280
           C 312 310, 250 330, 190 310 Z"
        fill="#52C490"/>
  <!-- 菜帮（奶白色，从底部伸出） -->
  <path d="M 220 350
           C 225 310, 240 280, 256 275
           C 272 280, 287 310, 292 350 Z"
        fill="#D8F0DD"/>
  <path d="M 170 355
           C 175 325, 188 305, 200 300
           C 210 305, 218 325, 220 355 Z"
        fill="#D8F0DD"/>
  <path d="M 292 355
           C 294 325, 302 305, 312 300
           C 324 305, 337 325, 342 355 Z"
        fill="#D8F0DD"/>
  <!-- 叶片高光 -->
  <path d="M 210 230 C 200 260, 205 295, 220 315"
        stroke="#7ED4A8" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 290 225 C 300 255, 295 290, 282 310"
        stroke="#7ED4A8" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- 蒜末点缀（小白点） -->
  <circle cx="200" cy="260" r="5" fill="#FFFDF7" opacity="0.8"/>
  <circle cx="290" cy="250" r="4" fill="#FFFDF7" opacity="0.8"/>
  <circle cx="250" cy="295" r="5" fill="#FFFDF7" opacity="0.7"/>
</svg>
