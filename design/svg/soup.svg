<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 汤碗：焦糖橙碗 + 金色浓汤 + 姜黄色蒸汽 -->
  <!-- 碗身 -->
  <path d="M 128 252
           L 154 392
           C 164 422, 348 422, 358 392
           L 384 252 Z"
        fill="#F0821E"/>
  <!-- 碗沿（深橙） -->
  <ellipse cx="256" cy="252" rx="128" ry="28" fill="#D06A0F"/>
  <!-- 金色浓汤面 -->
  <ellipse cx="256" cy="252" rx="112" ry="20" fill="#E6A23C"/>
  <!-- 汤面高光 -->
  <ellipse cx="240" cy="248" rx="30" ry="7" fill="#F5C96A" opacity="0.6"/>
  <!-- 碗身浅橙色弧线反光 -->
  <path d="M 172 290
           C 166 340, 178 382, 202 405"
        stroke="#F5B060" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- 左缕蒸汽（S形） -->
  <path d="M 222 222
           C 202 195, 244 175, 224 145
           C 212 127, 226 112, 236 98"
        stroke="#E6A23C" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- 右缕蒸汽（S形） -->
  <path d="M 286 222
           C 306 195, 264 175, 284 145
           C 296 127, 282 112, 272 98"
        stroke="#E6A23C" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.85"/>
</svg>
