<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 米饭碗：正面微俯视角 -->
  <!-- 碗身 -->
  <path d="M 138 248
           L 162 388
           C 172 418, 340 418, 350 388
           L 374 248 Z"
        fill="#D93A2B"/>
  <!-- 碗沿（深红，表示碗口厚度） -->
  <ellipse cx="256" cy="248" rx="120" ry="26" fill="#B42A1D"/>
  <!-- 碗内暗部 -->
  <ellipse cx="256" cy="248" rx="104" ry="18" fill="#8E1F15"/>
  <!-- 米饭：三团重叠的奶白色圆润弧形 -->
  <circle cx="208" cy="218" r="52" fill="#FFFDF7"/>
  <circle cx="256" cy="200" r="58" fill="#FFFDF7"/>
  <circle cx="306" cy="218" r="52" fill="#FFFDF7"/>
  <!-- 米饭顶部柔和高光 -->
  <ellipse cx="250" cy="185" rx="22" ry="10" fill="#FFFFFF" opacity="0.5"/>
  <!-- 碗身浅反光 -->
  <path d="M 175 280 C 170 330, 180 370, 200 395"
        stroke="#E87060" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
