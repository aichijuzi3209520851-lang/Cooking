<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 番茄：圆滚滚正红色，正面视角 -->
  <!-- 番茄主体 -->
  <circle cx="256" cy="285" r="132" fill="#E02020"/>
  <!-- 番茄底部稍暗 -->
  <path d="M 170 340
           C 190 395, 322 395, 342 340"
        stroke="#B81818" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.35"/>
  <!-- 左上椭圆形白色柔和高光 -->
  <ellipse cx="208" cy="235" rx="32" ry="20" fill="#FFFFFF" opacity="0.45"/>
  <!-- 绿茎 -->
  <rect x="248" y="142" width="16" height="28" rx="6" fill="#2F9E6E"/>
  <!-- 左蒂叶 -->
  <ellipse cx="218" cy="168" rx="38" ry="18" fill="#2F9E6E" transform="rotate(-32 218 168)"/>
  <!-- 中蒂叶 -->
  <ellipse cx="256" cy="148" rx="18" ry="36" fill="#3CB07E"/>
  <!-- 右蒂叶 -->
  <ellipse cx="294" cy="168" rx="38" ry="18" fill="#2F9E6E" transform="rotate(32 294 168)"/>
  <!-- 蒂叶中心连接点 -->
  <circle cx="256" cy="168" r="10" fill="#2F9E6E"/>
</svg>
