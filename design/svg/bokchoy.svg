<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 小青菜（上海青）：正面视角，直立 -->
  <!-- 根部奶白色 -->
  <ellipse cx="256" cy="420" rx="42" ry="14" fill="#D8F0DD"/>
  <!-- 菜帮（奶白色，从根部向上展开） -->
  <path d="M 222 420
           L 230 290
           C 236 268, 276 268, 282 290
           L 290 420 Z"
        fill="#D8F0DD"/>
  <!-- 左外层叶片 -->
  <path d="M 236 285
           C 190 265, 160 210, 170 155
           C 178 120, 210 110, 232 135
           C 250 155, 252 220, 244 280 Z"
        fill="#2F9E6E"/>
  <!-- 右外层叶片 -->
  <path d="M 276 285
           C 322 265, 352 210, 342 155
           C 334 120, 302 110, 280 135
           C 262 155, 260 220, 268 280 Z"
        fill="#2F9E6E"/>
  <!-- 中间叶片（最大，最靠前） -->
  <path d="M 256 105
           C 298 125, 312 190, 300 260
           C 296 282, 216 282, 212 260
           C 200 190, 214 125, 256 105 Z"
        fill="#3CB07E"/>
  <!-- 中间叶片高光 -->
  <path d="M 240 140
           C 232 180, 234 230, 244 260"
        stroke="#7ED4A8" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- 菜帮与叶片交界线 -->
  <path d="M 230 290 C 244 280, 268 280, 282 290"
        stroke="#B8DCC0" stroke-width="4" fill="none" opacity="0.6"/>
</svg>
