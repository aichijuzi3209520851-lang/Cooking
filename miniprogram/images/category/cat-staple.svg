<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 分类图：主食 —— 一碗白米饭
       为什么写得这么"朴素"：微信小程序的 image 组件对 SVG 支持有限，
       实测 <defs>/<linearGradient>（fill="url(#id)"）会导致整张图不渲染、<text> 更不支持。
       所以这里只用最基础的 path/ellipse + 纯色填充，靠「外圈描边层 + 主体层」两片叠加做出轮廓 —— 
       白米饭若不加米色外圈，在菜品缩略图的米黄底上会糊成一片、看不出形状。 -->

  <!-- 米饭：外圈（米色，充当描边） -->
  <path d="M 104 306
           C 118 182, 178 80, 256 80
           C 334 80, 394 182, 408 306 Z"
        fill="#E3D2B8"/>
  <!-- 米饭：主体（奶白） -->
  <path d="M 116 300
           C 128 192, 182 96, 256 96
           C 330 96, 384 192, 396 300 Z"
        fill="#FFFCF3"/>
  <!-- 米饭：上部柔光，避免大片死白 -->
  <ellipse cx="214" cy="196" rx="52" ry="26" fill="#FFFFFF" opacity="0.75"/>

  <!-- 碗身（圆底茶碗，作为底托） -->
  <path d="M 88 300
           C 92 382, 156 444, 256 444
           C 356 444, 420 382, 424 300 Z"
        fill="#D93A2B"/>
  <!-- 碗沿（深红，表示碗口厚度） -->
  <ellipse cx="256" cy="300" rx="168" ry="34" fill="#B42A1D"/>
  <!-- 碗内暗部 -->
  <ellipse cx="256" cy="300" rx="146" ry="24" fill="#8E1F15"/>
  <!-- 碗身左侧竖向反光（填充形，不用 stroke） -->
  <path d="M 132 332
           C 126 376, 148 412, 182 432
           C 154 408, 140 370, 146 334 Z"
        fill="#E87060" opacity="0.4"/>
</svg>
