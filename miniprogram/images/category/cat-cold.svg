<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 分类图：凉菜 —— 蔬菜沙拉（红黄绿三色，主体占满85%+） -->
  <!-- 盘子 -->
  <ellipse cx="256" cy="375" rx="208" ry="56" fill="#E8DDC8"/>
  <ellipse cx="256" cy="369" rx="208" ry="52" fill="#FDF3E3"/>
  <!-- 底层生菜叶（绿色铺底） -->
  <path d="M 90 350
           C 70 280, 140 210, 220 205
           C 260 202, 280 240, 270 290
           C 262 330, 170 360, 90 350 Z"
        fill="#2F9E6E"/>
  <path d="M 422 350
           C 442 280, 372 210, 292 205
           C 252 202, 232 240, 242 290
           C 250 330, 342 360, 422 350 Z"
        fill="#3CB07E"/>
  <!-- 红色食材：番茄块/半圆（多个） -->
  <circle cx="175" cy="290" r="38" fill="#E02020"/>
  <ellipse cx="175" cy="282" rx="30" ry="14" fill="#F05040" opacity="0.5"/>
  <circle cx="340" cy="285" r="35" fill="#D93A2B"/>
  <ellipse cx="340" cy="278" rx="27" ry="12" fill="#F05040" opacity="0.5"/>
  <circle cx="256" cy="330" r="32" fill="#E02020"/>
  <ellipse cx="256" cy="323" rx="24" ry="10" fill="#F05040" opacity="0.5"/>
  <!-- 黄色食材：玉米粒/块（多个圆角方块） -->
  <rect x="210" y="245" width="42" height="42" rx="12" fill="#E6A23C"/>
  <rect x="210" y="245" width="42" height="16" rx="12" fill="#F5C96A"/>
  <rect x="295" y="250" width="38" height="38" rx="11" fill="#E6A23C"/>
  <rect x="295" y="250" width="38" height="14" rx="11" fill="#F5C96A"/>
  <rect x="150" y="335" width="36" height="36" rx="10" fill="#E6A23C"/>
  <rect x="330" y="338" width="34" height="34" rx="10" fill="#F0B84A"/>
  <!-- 绿色食材：西兰花/青菜块（圆形+小凸起） -->
  <circle cx="200" cy="255" r="22" fill="#2F9E6E"/>
  <circle cx="190" cy="245" r="10" fill="#3CB07E"/>
  <circle cx="212" cy="243" r="9" fill="#3CB07E"/>
  <circle cx="320" cy="320" r="20" fill="#2F9E6E"/>
  <circle cx="312" cy="312" r="9" fill="#3CB07E"/>
  <circle cx="330" cy="310" r="8" fill="#3CB07E"/>
  <!-- 顶部小番茄（最靠前） -->
  <circle cx="256" cy="265" r="28" fill="#E02020"/>
  <ellipse cx="250" cy="258" rx="10" ry="6" fill="#F05040" opacity="0.6"/>
  <!-- 小绿叶蒂 -->
  <ellipse cx="256" cy="240" rx="10" ry="6" fill="#2F9E6E"/>
</svg>
